<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>คลังคำถาม · AP+forms</title>
  <link rel="stylesheet" href="/question-banks.css?v=5.4.3">
  <style>
    .qb-mobile-filter,.qb-mobile-filter-close{display:none}
    .pack-tabs{display:flex;gap:6px;margin-bottom:18px}.pack-tabs .active{border-color:var(--accent);background:#1b2540}
    @media(max-width:720px){
      .qb-mobile-filter,.qb-mobile-filter-close{display:inline-grid}
      .qb-library.mobile-open{display:block;position:fixed;inset:58px auto 0 0;width:min(330px,92vw);z-index:56;box-shadow:20px 0 60px rgba(0,0,0,.5);overflow:auto}
    }
    @media(max-width:520px){.qb-topbar button:nth-of-type(1),.qb-topbar button:nth-of-type(4){display:none}}
  </style>
</head>
<body>
  <div id="questionBanksApp"></div>
  <div id="qbToast" class="qb-toast" role="status" aria-live="polite"></div>
  <script type="module" src="/question-banks.js?v=5.4.5"></script>
</body>
</html>
