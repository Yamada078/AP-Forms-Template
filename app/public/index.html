  function collectChoiceAnswer(q){const selected=[],selectedIds=[],text={};const walk=(list,parentSelected=true)=>{for(const o of list||[]){if(!parentSelected)continue;const el=document.querySelector(`[data-choice-q="${CSS.escape(q.id)}"][data-opt-id="${CSS.escape(o.id)}"]`);const on=!!el?.checked;if(on){selected.push(o.label);selectedIds.push(o.id);if(o.allowText){const t=document.querySelector(`[data-other-q="${CSS.escape(q.id)}"][data-other-id="${CSS.escape(o.id)}"]`);if(t?.value.trim())text[o.id]=t.value.trim()}walk(o.children,true)}}};walk(q.options||[]);return{selected,selectedIds,text}}
  function collectRuntime(sec){collectRuntimeBlocks(sec.blocks||[],sess.answers,[]).filter(b=>b.type==='question').forEach(q=>{if(q.questionType==='short'||q.questionType==='long'){const x=document.querySelector(`[data-input="${CSS.escape(q.id)}"]`);if(x)sess.answers[q.id]=x.value.trim()}else if(q.questionType==='single'||q.questionType==='multi'){sess.answers[q.id]=collectChoiceAnswer(q)}else if(q.questionType==='dropdown'){const x=document.querySelector(`[data-select="${CSS.escape(q.id)}"]`);sess.answers[q.id]=x?.value||''}else if(q.questionType==='rating_matrix'){const rows={};document.querySelectorAll(`[data-matrix-q="${CSS.escape(q.id)}"]:checked`).forEach(x=>rows[x.dataset.rowId]=Number(x.value));sess.answers[q.id]={__type:'matrix',rows}}})}
  function updateRadarDom(q){const answer=sess.answers[q.id],values=radarValues(q,answer),max=Number(q.radarMax||5),n=q.radarAxes.length,points=values.map((v,i)=>{const p=radarPoint(i,n,v/max);return`${p.x.toFixed(2)},${p.y.toFixed(2)}`}).join(' ');document.querySelector(`[data-radar-area="${CSS.escape(q.id)}"]`)?.setAttribute('points',points);q.radarAxes.forEach((axis,i)=>{const p=radarPoint(i,n,values[i]/max),handle=document.querySelector(`[data-radar-q="${CSS.escape(q.id)}"][data-axis-id="${CSS.escape(axis.id)}"]`),label=document.querySelector(`[data-radar-value="${CSS.escape(q.id)}:${CSS.escape(axis.id)}"]`);if(handle){handle.setAttribute('cx',p.x);handle.setAttribute('cy',p.y);handle.setAttribute('aria-valuenow',values[i])}if(label){label.setAttribute('x',p.x);label.setAttribute('y',p.y-15);label.textContent=Number(values[i].toFixed(1))}})}
  function bindRadarInputs(){document.querySelectorAll('[data-radar-q][data-axis-id]').forEach(handle=>{const q=questionById(handle.dataset.radarQ,form);if(!q)return;let dragging=false;const ensure=()=>{if(sess.answers[q.id]?.__type==='radar')return sess.answers[q.id];const values={};for(const axis of q.radarAxes||[])values[axis.id]=Number((Number(q.radarMax||5)/2).toFixed(1));return(sess.answers[q.id]={__type:'radar',values})};const setFromPointer=e=>{const svg=handle.closest('svg'),rect=svg.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*400,y=(e.clientY-rect.top)/rect.height*400,index=Number(handle.dataset.axisIndex),angle=-Math.PI/2+index*Math.PI*2/q.radarAxes.length,projection=((x-200)*Math.cos(angle)+(y-200)*Math.sin(angle))/126,max=Number(q.radarMax||5),value=Math.round(Math.max(0,Math.min(1,projection))*max*10)/10,answer=ensure();answer.values[handle.dataset.axisId]=value;updateRadarDom(q)};handle.onpointerdown=e=>{dragging=true;handle.classList.add('dragging');handle.setPointerCapture?.(e.pointerId);setFromPointer(e);e.preventDefault()};handle.onpointermove=e=>{if(dragging)setFromPointer(e)};handle.onpointerup=handle.onpointercancel=e=>{dragging=false;handle.classList.remove('dragging');handle.releasePointerCapture?.(e.pointerId)};handle.onkeydown=e=>{if(!['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key))return;const answer=ensure(),axis=handle.dataset.axisId,max=Number(q.radarMax||5),delta=['ArrowUp','ArrowRight'].includes(e.key)?.1:-.1;answer.values[axis]=Math.max(0,Math.min(max,Number(answer.values[axis]||0)+delta));updateRadarDom(q);e.preventDefault()}})}
  function bindRuntimeInputs(sec,rerender){const keep=()=>rerender(true);document.querySelectorAll('[data-rate-q]').forEach(btn=>btn.onclick=()=>{collectRuntime(sec);sess.answers[btn.dataset.rateQ]=Number(btn.dataset.rate);pruneHiddenAnswers();keep()});const hasConditional=form.sections.some(s=>(s.blocks||[]).some(b=>b.condition?.enabled));const maybeRerender=()=>{collectRuntime(sec);pruneHiddenAnswers();if(hasConditional||document.querySelector('[data-choice-q]'))keep()};document.querySelectorAll('[data-choice-q],[data-select],[data-matrix-q]').forEach(el=>el.onchange=maybeRerender);document.querySelectorAll('[data-input]').forEach(el=>{el.onbeforeinput=e=>{if(e.isComposing||String(e.inputType||'').startsWith('delete'))return;const q=questionById(el.dataset.input,form),v={...defaultValidation(),...(q?.validation||{})},bad=String(v.value||'');if(!v.enabled||v.operator!=='forbid_contains'||!bad||e.data==null)return;const a=el.selectionStart??el.value.length,b=el.selectionEnd??a,next=el.value.slice(0,a)+e.data+el.value.slice(b);if(next.includes(bad)){e.preventDefault();const msg=v.message||`ไม่อนุญาตให้พิมพ์ “${bad}”`,err=document.querySelector(`[data-input-error="${CSS.escape(el.dataset.input)}"]`);el.classList.add('invalid');if(err){err.textContent=msg;err.classList.add('show')}}};el.oninput=()=>{sess.answers[el.dataset.input]=el.value;const q=questionById(el.dataset.input,form),msg=validateAnswer(q,el.value),err=document.querySelector(`[data-input-error="${CSS.escape(el.dataset.input)}"]`);el.classList.toggle('invalid',!!msg);if(err){err.textContent=msg;err.classList.toggle('show',!!msg)}}});document.querySelectorAll('[data-other-q]').forEach(el=>el.oninput=()=>{const q=questionById(el.dataset.otherQ,form);if(q)sess.answers[q.id]=collectChoiceAnswer(q)});bindRadarInputs()}
