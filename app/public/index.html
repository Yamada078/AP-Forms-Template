<script>
(()=>{
'use strict';
const app=document.querySelector('#app');
const toastEl=document.querySelector('#toast');
const qs=new URLSearchParams(location.search);
const publicPathMatch=location.pathname.match(/^\/f\/([^/]+)\/?$/);
const publicFormId=publicPathMatch?decodeURIComponent(publicPathMatch[1]):qs.get('f');
const uid=(p='id')=>`${p}_${crypto.getRandomValues(new Uint32Array(2)).join('').slice(0,13)}`;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const state={token:sessionStorage.getItem('goi_team_key')||'',memberName:sessionStorage.getItem('goi_member_name')||'',sessionId:sessionStorage.getItem('goi_collab_session')||uid('member'),forms:[],form:null,view:'forms',sectionId:null,blockId:null,builderPanel:null,dirty:false,saving:false,editRevision:0,responses:[],responseVersions:new Map(),responseCompatibility:[],analyticsMerges:new Set(),responseSelection:new Set(),responseSummaryScope:'all',responseFilter:'',responseSourceFilter:'all',applications:[],integrationCapabilities:[],integrationForms:[],integrationQuestionPacks:[],applicationId:null,applicationsLoading:false,applicationError:'',integrationBusy:false,health:null,dragBlockId:null,collab:{ws:null,connected:false,connecting:false,role:'offline',editor:null,peers:[],reconnectTimer:null,reconnectAttempt:0,draftTimer:null,commitTimer:null,pending:new Map(),remoteDraft:false}};
const MATRIX=window.GOI_MATRIX_SCALE;
sessionStorage.setItem('goi_collab_session',state.sessionId);
let autosaveTimer=null;

function toast(msg,ms=2200){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),ms)}
async function api(path,opts={}){const headers={...(opts.headers||{})};if(opts.json!==false)headers['Content-Type']='application/json';if(state.token)headers.Authorization='Bearer '+state.token;if(state.sessionId)headers['X-GOI-Session-ID']=state.sessionId;const r=await fetch(path,{...opts,headers});let data={};try{data=await r.json()}catch{}if(!r.ok){const e=new Error(data.error||`HTTP ${r.status}`);e.status=r.status;e.data=data;throw e}return data}
function canEdit(){return !state.form||state.collab.role==='editor'||(!state.collab.connected&&state.collab.role!=='viewer')}
function markDirty(){if(state.form&&state.collab.connected&&state.collab.role!=='editor'){toast(`${state.collab.editor?.name||'สมาชิกคนอื่น'} กำลังแก้ไขอยู่ ตอนนี้คุณเป็นผู้ดูแบบสด`,2600);return}state.editRevision++;state.dirty=true;updateSaveBadge();scheduleLiveDraft();clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{if(state.dirty&&state.form&&!state.saving)saveForm(true)},5000)}
function updateSaveBadge(){const el=document.querySelector('#saveState');if(!el)return;el.textContent=state.saving?'กำลังบันทึก…':state.dirty?'กำลังรอบันทึก':'บันทึกแล้ว'}
function currentSection(){return state.form?.sections?.find(s=>s.id===state.sectionId)||state.form?.sections?.[0]||null}
function walkOptionBlocks(options,fn){for(const o of options||[]){for(const b of o.blocks||[])walkBlockTree([b],fn,o);walkOptionBlocks(o.children,fn)}}
function walkBlockTree(blocks,fn,parentOption=null){for(const b of blocks||[]){fn(b,parentOption);if(b.type==='question')walkOptionBlocks(b.options,fn)}}
function findBlockContext(blocks,id,parentOption=null,parentQuestion=null){for(const list of [blocks||[]]){for(let i=0;i<list.length;i++){const b=list[i];if(b.id===id)return{block:b,list,index:i,parentOption,parentQuestion};if(b.type==='question'){const scanOpts=opts=>{for(const o of opts||[]){const hit=findBlockContext(o.blocks||[],id,o,b);if(hit)return hit;const deep=scanOpts(o.children);if(deep)return deep}return null};const hit=scanOpts(b.options);if(hit)return hit}}}return null}
function currentBlockContext(){return findBlockContext(currentSection()?.blocks||[],state.blockId)}
function currentBlock(){return currentBlockContext()?.block||null}
function allQuestions(form=state.form){const out=[];(form?.sections||[]).forEach((s,si)=>{let bi=0;walkBlockTree(s.blocks||[],b=>{if(b.type==='question')out.push({section:s,sectionIndex:si,block:b,blockIndex:bi++})})});return out}
function qLabel(id,form=state.form){const q=allQuestions(form).find(x=>x.block.id===id);return q?`${q.section.title || 'Section'} · ${q.block.title || 'คำถาม'}`:'ไม่พบคำถาม'}
function sectionLabel(id){const i=state.form.sections.findIndex(s=>s.id===id);return i>=0?`${i+1}. ${state.form.sections[i].title}`:'ไม่พบ Section'}

function defaultCondition(){return{enabled:false,questionId:'',operator:'equals',value:'',value2:''}}
function defaultValidation(){return{enabled:false,operator:'forbid_equals',value:'',message:''}}
function defaultRespondentField(n=1){return{id:uid('rf'),type:'short',label:`ข้อมูลผู้ตอบ ${n}`,description:'',placeholder:'',required:false,primary:false,options:[],validation:defaultValidation()}}
function defaultStartPage(title='แบบสอบถาม',description=''){return{title:String(title||'แบบสอบถาม'),description:String(description||''),fields:[{...defaultRespondentField(1),id:'respondent_name',label:'ชื่อ',placeholder:'พิมพ์ชื่อหรือชื่อเล่น',required:true,primary:true}]}}
function normalizeStartPage(form){const source=form?.startPage&&typeof form.startPage==='object'?form.startPage:defaultStartPage(form?.title,form?.description);const fields=(Array.isArray(source.fields)?source.fields:[]).slice(0,30).map((field,i)=>{const type=['short','long','dropdown'].includes(field?.type)?field.type:'short';return{id:String(field?.id||`respondent_${i+1}`),type,label:String(field?.label||`ข้อมูลผู้ตอบ ${i+1}`),description:String(field?.description||''),placeholder:String(field?.placeholder||''),required:!!field?.required,primary:!!field?.primary,options:type==='dropdown'?(Array.isArray(field?.options)?field.options:[]).map(String).map(x=>x.trim()).filter(Boolean):[],validation:{...defaultValidation(),...(field?.validation||{})}}});let primary=false;fields.forEach(field=>{if(field.primary&&!primary)primary=true;else field.primary=false});return{title:String(source.title??form?.title??'แบบสอบถาม'),description:String(source.description??form?.description??''),fields}}
function normalizeBlock(b){b=b||{};b.id=b.id||uid('b');b.width=Number(b.width||100);b.condition={...defaultCondition(),...(b.condition||{})};if(b.type==='question'){b.placeholder=String(b.placeholder||'');b.options=normalizeOptions(b.options);b.validation={...defaultValidation(),...(b.validation||{})};b.ratingMax=Math.max(2,Math.min(10,Number(b.ratingMax||5)));b.matrixRows=Array.isArray(b.matrixRows)&&b.matrixRows.length?b.matrixRows.map(r=>({id:r.id||uid('mr'),label:r.label||'รายการ'})):matrixRowsDefault();if(b.questionType==='rating_matrix')b.matrixScale=MATRIX.normalizeScale(b);if(b.questionType==='radar'){b.radarMax=Math.max(2,Math.min(10,Number(b.radarMax||5)));b.radarAxes=normalizeRadarAxes(b.radarAxes)}}return b}
function normalizeOption(o){o=o||{};return{id:o.id||uid('o'),label:o.label||'ตัวเลือก',score:Number(o.score||0),allowText:!!o.allowText,placeholder:String(o.placeholder||''),children:Array.isArray(o.children)?o.children.map(normalizeOption):[],blocks:Array.isArray(o.blocks)?o.blocks.map(normalizeBlock):[]}}
function normalizeOptions(list){return(Array.isArray(list)?list:[]).map(normalizeOption)}
function findOption(list,id){for(const o of list||[]){if(o.id===id)return o;const x=findOption(o.children,id);if(x)return x}return null}
function removeOption(list,id){for(let i=0;i<(list||[]).length;i++){if(list[i].id===id){list.splice(i,1);return true}if(removeOption(list[i].children,id))return true}return false}
function flattenOptions(list,out=[]){for(const o of list||[]){out.push(o);flattenOptions(o.children,out)}return out}
function answerValues(answer){if(answer==null)return[];if(Array.isArray(answer))return answer;if(typeof answer==='object'){if(Array.isArray(answer.selected))return answer.selected;if(answer.__type==='matrix')return Object.values(answer.rows||{});if(answer.__type==='radar')return Object.values(answer.values||{});return Object.values(answer)}return[answer]}
function answerTextMap(answer){return answer&&typeof answer==='object'&&!Array.isArray(answer)&&answer.text?answer.text:{}}
function answerSelectedIds(answer){return answer&&typeof answer==='object'&&!Array.isArray(answer)&&Array.isArray(answer.selectedIds)?answer.selectedIds:[]}
function matrixAverage(answer){if(!answer||typeof answer!=='object'||!['matrix','radar'].includes(answer.__type))return null;const vals=Object.values(answer.__type==='radar'?answer.values||{}:answer.rows||{}).map(Number).filter(Number.isFinite);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null}
function numericAnswer(answer){const avg=matrixAverage(answer);if(avg!=null)return avg;const vals=answerValues(answer).map(Number).filter(Number.isFinite);return vals.length?vals[0]:NaN}
function parseListValue(v){return String(v??'').split(',').map(x=>x.trim()).filter(Boolean)}
function questionById(id,form=state.form){return allQuestions(form).find(x=>x.block.id===id)?.block||null}
function hasConditionAnswer(answer){if(answer==null)return false;if(answer&&typeof answer==='object'&&answer.__type==='matrix')return Object.keys(answer.rows||{}).length>0;return answerValues(answer).some(v=>String(v??'').trim()!=='')||Object.values(answerTextMap(answer)).some(v=>String(v??'').trim()!=='')}
function evaluate(answer,operator='equals',value='',value2=''){
  if(!hasConditionAnswer(answer))return false;
  const norm=v=>String(v??'').trim().toLocaleLowerCase();
  const vals=[...answerValues(answer),...Object.values(answerTextMap(answer))].map(norm).filter(Boolean);
  const target=norm(value);
  if(operator==='equals')return !!target&&vals.some(v=>v===target);
  if(operator==='not_equals')return !!target&&!vals.some(v=>v===target);
  if(operator==='contains')return !!target&&vals.some(v=>v.includes(target));
  if(operator==='one_of'||operator==='not_one_of'){
    const wanted=parseListValue(value).map(norm).filter(Boolean);
    if(!wanted.length)return false;
    const hit=vals.some(v=>wanted.includes(v));
    return operator==='one_of'?hit:!hit;
  }
  const n=numericAnswer(answer),a=Number(value),b=Number(value2);
  if(!Number.isFinite(n)||!Number.isFinite(a))return false;
  if(operator==='gte')return n>=a;
  if(operator==='lte')return n<=a;
  if(operator==='between')return Number.isFinite(b)&&n>=Math.min(a,b)&&n<=Math.max(a,b);
  return false;
}
function visibleBlock(block,answers){const c=block?.condition;if(!c?.enabled)return true;if(!c.questionId)return false;return evaluate(answers?.[c.questionId],c.operator,c.value,c.value2)}

function migrateForm(raw){
  if(raw&&Array.isArray(raw.sections)){
    const lackedStart=!raw.startPage;raw.startPage=normalizeStartPage(raw);if(lackedStart)raw._migrated=true;
    raw.version=5;raw.theme=raw.theme||{accent:'#7c9cff',paperWidth:900};
    raw.sections.forEach((s,i)=>{s.id=s.id||uid('sec');s.title=s.title||`ส่วนที่ ${i+1}`;s.description=s.description||'';s.nextLabel=s.nextLabel||'ถัดไป';s.blocks=(Array.isArray(s.blocks)?s.blocks:[]).map(normalizeBlock);s.routingRules=Array.isArray(s.routingRules)?s.routingRules:[];s.routingRules.forEach(r=>{r.value2=r.value2||''})});
    return raw;
  }
  if(raw&&Array.isArray(raw.questions)){
    const f={version:5,title:raw.title||'แบบสอบถาม',description:raw.description||'',startPage:defaultStartPage(raw.title||'แบบสอบถาม',raw.description||''),theme:{accent:'#7c9cff',paperWidth:900},sections:[newSection(1)]};
    f.sections[0].title='คำถามเดิม';
    f.sections[0].blocks=raw.questions.map(q=>({id:q.id||uid('b'),type:'question',width:100,condition:defaultCondition(),questionType:q.type==='single'?'single':q.type==='rating'?'rating':q.type==='longtext'?'long':'short',title:q.title||'คำถาม',description:'',required:!!q.required,placeholder:'',validation:defaultValidation(),ratingMax:q.ratingMax||5,options:normalizeOptions(q.options),matrixRows:matrixRowsDefault()}));

}

async function loadPublic(id){
  app.innerHTML=`<div class="respond-bg"><div class="respond-shell"><div class="respond-paper"><h2>กำลังโหลดแบบฟอร์ม…</h2><p class="respond-desc">กำลังเตรียมคำถาม</p></div></div></div>`;
  try{
    const d=await api('/api/public/forms/'+encodeURIComponent(id));
    if(d.publication?.state!=='OPEN'){renderPublicState(d.publication);return}
    const f=migrateForm(structuredClone(d.form||{}));
    f.id=id;f.publication=d.publication;
    runRuntime(f,false);
  }catch(e){
    if(e.status===401&&window.APAccount){APAccount.login(location.pathname+location.search);return}
    const revoked=e.data?.code==='LINK_REVOKED';
    app.innerHTML=`<div class="respond-bg"><div class="respond-shell"><div class="respond-paper public-state-card"><h2>${revoked?'ลิงก์นี้ไม่สามารถใช้งานได้แล้ว':'เปิดแบบฟอร์มไม่สำเร็จ'}</h2><p class="respond-desc">${esc(e.message||'ไม่สามารถโหลดแบบฟอร์มได้')}</p>${revoked?'':`<div class="runtime-actions"><button id="retryPublic" class="runtime-btn">ลองอีกครั้ง</button></div>`}</div></div></div>`;

  }
}

function bindApplicationNavigation(){const backForms=document.querySelector('#backToForms');if(backForms)backForms.onclick=()=>{state.view='forms';renderAdmin()};const retry=document.querySelector('#retryApplications');if(retry)retry.onclick=()=>loadApplications();const create=document.querySelector('#createApplication'),createEmpty=document.querySelector('#createApplicationEmpty');if(create)create.onclick=showCreateApplication;if(createEmpty)createEmpty.onclick=showCreateApplication;document.querySelectorAll('[data-manage-application]').forEach(button=>button.onclick=()=>{state.applicationId=button.dataset.manageApplication;state.view='application';renderAdmin()});document.querySelectorAll('[data-delete-application]').forEach(button=>button.onclick=()=>confirmApplicationDelete(button.dataset.deleteApplication))}

lete(application.id)}}}

function showCreateCredential(){const application=selectedApplication();if(!application||application.status==='REVOKED')return;closeIntegrationModal('#integrationModal');document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="integrationModal"><div class="modal compact"><div class="head"><div><h2>Create Integration Key</h2><div class="tiny muted">${esc(application.name)}</div></div><div class="spacer"></div><button id="closeIntegrationModal" class="btn sm">×</button></div><div class="field"><label>Key label (optional)</label><input id="credentialLabel" class="input" maxlength="120" autocomplete="off" placeholder="เช่น Production"></div><div class="field" style="margin-top:10px"><label>Expires (optional)</label><input id="credentialExpires" class="input" type="datetime-local"></div><div id="integrationModalError" class="error"></div><div class="modal-actions"><button id="cancelIntegrationModal" class="btn">Cancel</button><button id="submitCredential" class="btn primary">Create Key</button></div></div></div>`);const close=()=>closeIntegrationModal('#integrationModal');document.querySelector('#closeIntegrationModal').onclick=close;document.querySelector('#cancelIntegrationModal').onclick=close;document.querySelector('#submitCredential').onclick=async()=>{const button=document.querySelector('#submitCredential'),label=document.querySelector('#credentialLabel').value.trim(),expires=document.querySelector('#credentialExpires').value,error=document.querySelector('#integrationModalError');button.disabled=true;button.textContent='Creating…';try{const payload={label};if(expires)payload.expiresAt=new Date(expires).toISOString();const data=await api(`/api/admin/integrations/applications/${encodeURIComponent(application.id)}/credentials`,{method:'POST',body:JSON.stringify(payload)});close();await loadApplications(false);renderAdmin();showOneTimeSecret(data.secret,data.credential?.secretPrefix);toast('Integration Key Created')}catch(failure){error.textContent=failu async function saveApplicationPermissions(){const application=selectedApplication(),button=document.querySelector('#savePermissions');if(!application||!button)return;const readySelected=[...document.querySelectorAll('[data-integration-permission]:checked:not(:disabled)')].map(input=>input.dataset.integrationPermission),futureExisting=(application.permissions||[]).filter(capability=>!integrationPermissionInfo.some(info=>info.key===capability&&info.ready)),permissions=[...new Set([...readySelected,...futureExisting])];button.disabled=true;button.textContent='Saving…';try{await api(`/api/admin/integrations/applications/${encodeURIComponent(application.id)}/permissions`,{method:'PUT',body:JSON.stringify({permissions})});await loadApplications(false);renderAdmin();toast('Permissions updated')}catch(error){button.disabled=false;button.textContent='Save Permissions';toast(`Permission update failed: ${error.message}`,3600)}}

function confirmCredentialRevoke(credentialId){const application=selectedApplication();if(!application)return;showIntegrationConfirm({title:'Revoke this integration key?',message:'Application ที่ยังใช้ Key นี้อยู่จะเชื่อมต่อไม่ได้ การ Revoke เป็นแบบถาวร หากต้องใช้ต่อให้สร้าง Key ใหม่',confirmLabel:'Revoke Key',action:async()=>{const result=await api(`/api/admin/integrations/applications/${encodeURIComponent(application.id)}/credentials/${encodeURIComponent(credentialId)}/revoke`,{method:'POST',body:'{}'}),credential=(application.credentials||[]).find(item=>item.id===credentialId);if(credential){credential.status='REVOKED';credential.revoked_at=result.revokedAt||new Date().toISOString()}renderAdmin();await loadApplications(false);renderAdmin();toast('Credential revoked — Delete Key is now available')}})}

function formsView(){return`<div class="head application-head"><div><h1>Forms</h1><div class="muted small">สร้างแบบสอบถามแบบเป็น Section / Page และแตกคำถามภายในหน้าเดียวกันได้</div></div><div class="spacer"></div><button id="questionBanksBtn" class="btn">Question Banks</button><button id="applicationsBtn" class="btn">Applications</button><button id="newFormBtn" class="btn primary">+ สร้างฟอร์ม</button></div>${state.forms.length?state.forms.map(f=>{const pub=f.publication||{state:f.published?'OPEN':'DRAFT',publishedVersion:0};return`<div class="form-row"><div class="grow"><strong>${esc(f.title)}</strong><div class="tiny muted">แก้ไขล่าสุด ${esc(f.updated_at||'-')}${pub.publishedVersion?` · Published V${pub.publishedVersion}`:''}</div></div><span class="status ${String(pub.state||'DRAFT').toLowerCase()}">${esc(publicationLabels[pub.state]||pub.state||'DRAFT')}</span><button class="btn sm" data-open="${esc(f.id)}">เปิด</button><button class="btn sm danger" data-delete="${esc(f.id)}">ลบ</button></div>`}).join(''):`<div class="empty">ยังไม่มีฟอร์ม กด “สร้างฟอร์ม” เพื่อเริ่มจากหน้ากระดาษแรก</div>`}`}
function bindForms(){document.querySelector('#questionBanksBtn').onclick=()=>location.href='/question-banks.html';document.querySelector('#applicationsBtn').onclick=openApplications;document.querySelector('#newFormBtn').onclick=async()=>{const d=await api('/api/forms',{method:'POST',body:JSON.stringify({title:'แบบสอบถามใหม่'})});await loadForms();await openForm(d.id)};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openForm(b.dataset.open));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบฟอร์มนี้รวม Responses ทั้งหมดหรือไม่?'))return;await api('/api/forms/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});await loadForms();renderAdmin()})}
async function openForm(id){disconnectCollab();const d=await api('/api/forms/'+encodeURIComponent(id));const f=migrateForm(d.form);state.form={id,...f,published:d.published,publication:d.publication,updated_at:d.updated_at};state.sectionId=f.sections[0]?.id||null;state.blockId=null;state.view='builder';state.editRevision=0;state.dirty=!!f._migrated;delete f._migrated;renderAdmin();connectCollab(id);if(state.dirty){state.editRevision++;clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{if(state.dirty&&state.form&&!state.saving)saveForm(true)},5000);toast('ฟอร์มรุ่นเก่าถูกแปลงเป็น Section แบบใหม่แล้ว ระบบจะบันทึกให้อัตโนมัติ')}}

function builderView(){const sec=currentSection(),isStart=state.sectionId==='START',panel=state.builderPanel?`panel-${state.builderPanel}`:'',blockTypes=[['question','Question'],['heading','Heading'],['text','Text'],['image','Image'],['audio','Audio'],['video','Video'],['panel','Panel'],['divider','Divider'],['spacer','Spacer']];return`<div class="builder app-shell ${panel} ${state.collab.connected&&state.collab.role==='viewer'?'viewer-mode':''}"><div class="builder-backdrop" data-close-builder-panel></div><aside class="rail builder-pages"><button class="btn square rail-close" data-close-builder-panel aria-label="ปิด Pages">×</button><div class="rail-head"><div class="rail-title">Start / Sections / Pages</div><button id="addSection" class="btn sm primary" style="width:100%;margin-top:10px">+ Add Section</button></div><div class="rail-scroll"><div class="section-item ${isStart?'active':''}" data-start-page><div class="n">START</div><div class="t">Respondent Info</div><div class="tiny muted">${state.form.startPage.fields.length} fields · ไม่อยู่ใน Page Routing</div></div>${state.form.sections.map((s,i)=>`<div class="section-item ${s.id===state.sectionId?'active':''}" data-section="${esc(s.id)}"><div class="n">PAGE ${i+1}</div><div class="t">${esc(s.title||`ส่วนที่ ${i+1}`)}</div><div class="tiny muted">${s.blocks.length} blocks</div><div class="section-actions"><button class="btn sm" data-sec-up="${esc(s.id)}">↑</button><button class="btn sm" data-sec-down="${esc(s.id)}">↓</button><button class="btn sm" data-sec-dup="${esc(s.id)}">Duplicate</button></div></div>`).join('')}</div></aside><main class="canvas-area"><div class="canvas-wrap">${collabBannerHtml()}<div class="form-meta"><div class="field"><label>ชื่อฟอร์มภายในทีม</label><input id="formTitle" class="input" value="${esc(state.form.title)}"></div><div class="field"><label>คำอธิบายภายใน Form</label><textarea id="formDesc" class="textarea" style="min-height:76px" placeholder="คำอธิบายรวมของ Form">${esc(state.form.description||'')}</textarea></div></div>${isStart?startPageCanvas():sec?paperView(sec):'<div class="empty">ไม่มี Section</div>'}</div></main><aside class="rail right builder-tools"><button class="btn square rail-close" data-close-builder-panel aria-label="ปิดเครื่องมือ">×</button><div class="rail-head add-pane"><div class="rail-title">${isStart?'Start Page':'Add Blocks'}</div>${isStart?'<div class="mini-note">START ใช้ Respondent Fields ไม่ใช่ Blocks และไม่เข้าระบบ Page Routing</div>':`<div class="add-grid">${blockTypes.map(x=>`<button class="add-block" data-add-block="${x[0]}">+ ${x[1]}</button>`).join('')}</div>`}</div><div class="rail-scroll inspector-pane">${inspectorView(sec,currentBlock())}</div></aside><nav class="mobile-builder-toolbar" aria-label="เครื่องมือ Builder"><button data-mobile-panel="pages" class="${state.builderPanel==='pages'?'active':''}">Pages</button><button data-mobile-panel="${isStart?'edit':'add'}" class="${state.builderPanel==='add'?'active':''}">${isStart?'Start':'Add'}</button><button data-mobile-panel="edit" class="${state.builderPanel==='edit'?'active':''}">Edit</button><button id="mobilePreview">Preview</button><button id="mobileSave">Save</button><button id="mobilePublish" class="primary-action">Publish</button></nav></div>`}
function paperView(sec){return`<div class="paper" style="max-width:${Number(state.form.theme?.paperWidth||900)}px;margin:auto"><div class="paper-top"><input id="sectionTitle" class="paper-title" value="${esc(sec.title)}" placeholder="ชื่อ Section"><textarea id="sectionDesc" class="paper-desc" placeholder="คำอธิบายของหน้านี้">${esc(sec.description||'')}</textarea></div><div class="block-grid" id="blockGrid">${sec.blocks.length?sec.blocks.map(b=>blockCanvas(b)).join(''):'<div class="drop-hint">หน้านี้ยังว่าง — เพิ่ม Question, Text, Image, Audio หรือ Block อื่นจากด้านขวา</div>'}</div><div class="bottom-next"><span class="tiny" style="color:#8793a6">Section ${state.form.sections.findIndex(s=>s.id===sec.id)+1} / ${state.form.sections.length}</span><button class="paper-button">${esc(sec.nextLabel||'ถัดไป')} →</button></div></div>`}
function startFieldCanvas(field){const fake=field.type==='dropdown'?`<div class="preview-input">เลือกคำตอบ ▾</div>`:`<div class="preview-input">${esc(field.placeholder||'')}</div>`;return`<div class="start-field-preview" data-start-preview="${esc(field.id)}"><label data-start-preview-label="${esc(field.id)}">${esc(field.label)} ${field.required?'<span class="req">*</span>':''}</label>${field.description?`<div class="field-description" data-start-preview-desc="${esc(field.id)}">${esc(field.description)}</div>`:''}${fake}</div>`}
function startPageCanvas(){const start=state.form.startPage;return`<div class="paper" style="max-width:${Number(state.form.theme?.paperWidth||900)}px;margin:auto"><div class="paper-top"><div class="paper-title">${esc(start.title||state.form.title)}</div><div class="paper-desc">${esc(start.description||'')}</div></div>${start.fields.map(startFieldCanvas).join('')||'<div class="drop-hint">Anonymous form · ไม่มีข้อมูลผู้ตอบที่ต้องกรอก</div>'}<div class="bottom-next"><span class="tiny" style="color:#8793a6">START · ไม่อยู่ใน Page Routing</span><button class="paper-button">เริ่มตอบ →</button></div></div>`}
function respondentFieldEditor(field,index,total){const v={...defaultValidation(),...(field.validation||{})};return`<div class="respondent-editor" data-rf-card="${esc(field.id)}"><div class="field"><label>Label</label><input class="input rfLabel" data-rfid="${esc(field.id)}" value="${esc(field.label)}"></div><div class="field" style="margin-top:7px"><label>Description</label><textarea class="textarea rfDescription" data-rfid="${esc(field.id)}" style="min-height:60px">${esc(field.description||'')}</textarea></div><div class="field" style="margin-top:7px"><label>Placeholder</label><input class="input rfPlaceholder" data-rfid="${esc(field.id)}" value="${esc(field.placeholder||'')}"></div><div class="field" style="margin-top:7px"><label>Type</label><select class="select rfType" data-rfid="${esc(field.id)}"><option value="short" ${field.type==='short'?'selected':''}>Short text</option><option value="long" ${field.type==='long'?'selected':''}>Long text</option><option value="dropdown" ${field.type==='dropdown'?'selected':''}>Dropdown</option></select></div>${field.type==='dropdown'?`<div class="field" style="margin-top:7px"><label>Dropdown options (หนึ่งบรรทัดต่อหนึ่งตัวเลือก)</label><textarea class="textarea rfOptions" data-rfid="${esc(field.id)}">${esc((field.options||[]).join('\n'))}</textarea></div>`:''}<div class="row wrap" style="margin-top:8px"><label class="check"><input class="rfRequired" data-rfid="${esc(field.id)}" type="checkbox" ${field.required?'checked':''}> Required</label><label class="check"><input class="rfPrimary" data-rfid="${esc(field.id)}" name="primaryRespondent" type="radio" ${field.primary?'checked':''}> Primary identifier</label></div><div class="field" style="margin-top:8px"><label>Validation</label><select class="select rfValidationOp" data-rfid="${esc(field.id)}"><option value="" ${!v.enabled?'selected':''}>ไม่ใช้</option><option value="forbid_equals" ${v.enabled&&v.operator==='forbid_equals'?'selected':''}>ห้ามเท่ากับ</option><option value="forbid_contains" ${v.enabled&&v.operator==='forbid_contains'?'selected':''}>ห้ามมีข้อความนี้</option></select></div>${v.enabled?`<input class="input rfValidationValue" data-rfid="${esc(field.id)}" value="${esc(v.value||'')}" placeholder="ค่าที่ห้าม" style="margin-top:6px"><input class="input rfValidationMessage" data-rfid="${esc(field.id)}" value="${esc(v.message||'')}" placeholder="ข้อความแจ้งเตือน" style="margin-top:6px">`:''}<div class="respondent-editor-actions"><button class="btn sm rfUp" data-rfid="${esc(field.id)}" ${index===0?'disabled':''}>↑</button><button class="btn sm rfDown" data-rfid="${esc(field.id)}" ${index===total-1?'disabled':''}>↓</button><button class="btn sm danger rfDelete" data-rfid="${esc(field.id)}">ลบ Field</button></div></div>`}
function startPageInspector(){const start=state.form.startPage;return`<div class="inspector-section"><div class="inspector-title">Start Page</div><div class="field"><label>Title</label><input id="startTitle" class="input" value="${esc(start.title||'')}"></div><div class="field" style="margin-top:8px"><label>Description</label><textarea id="startDescription" class="textarea">${esc(start.description||'')}</textarea></div></div><div class="inspector-section"><div class="head" style="margin-bottom:7px"><div class="inspector-title" style="margin:0">Respondent Info</div><div class="spacer"></div><button id="addRespondentField" class="btn sm">+ Field</button></div><button id="clearPrimaryField" class="btn sm" style="width:100%">ใช้ Anonymous / ไม่กำหนด Primary</button>${start.fields.map((field,index)=>respondentFieldEditor(field,index,start.fields.length)).join('')||'<div class="mini-note">ไม่มี Field ผู้ตอบสามารถเริ่มแบบ Anonymous ได้ทันที</div>'}</div>`}
function blockCanvas(b,nested=false){const tag=b.condition?.enabled?`<div class="conditional-tag">Conditional: ${esc(conditionSummary(b.condition))}</div>`:'';let inner='';
  if(b.type==='heading')inner=`<div class="render-heading ${esc(b.level||'h2')}">${esc(b.text||'หัวข้อ')}</div>`;
  else if(b.type==='text')inner=`<div class="render-text">${esc(b.text||'')}</div>`;
  else if(b.type==='panel')inner=`<div class="render-panel"><strong>${esc(b.title||'')}</strong><div>${esc(b.text||'')}</div></div>`;
  else if(b.type==='divider')inner='<div class="render-divider"></div>';
  else if(b.type==='spacer')inner=`<div class="render-spacer" style="height:${Number(b.height||28)}px">Spacer ${Number(b.height||28)}px</div>`;
  else if(['image','audio','video'].includes(b.type))inner=mediaCanvas(b);
  else if(b.type==='question')inner=questionCanvas(b);
  return`<div class="block-shell ${b.id===state.blockId?'selected':''}" draggable="${nested?'false':'true'}" data-block="${esc(b.id)}" data-nested="${nested?'1':'0'}" style="width:${nested?'100%':widthCss(b.width)}"><span class="block-badge">${esc(b.type)}</span>${tag}${inner}</div>`}
function mediaCanvas(b){if(!b.src)return`<div class="media-placeholder"><div><strong>${b.type.toUpperCase()}</strong><br><span>เลือก Block นี้แล้วใส่ URL หรือ path จาก /assets ใน Inspector</span></div></div>`;if(b.type==='image')return`<figure class="render-media"><img src="${esc(b.src)}" alt="${esc(b.caption||'image')}">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`;if(b.type==='audio')return`<figure class="render-media"><audio src="${esc(b.src)}" controls ${b.loop?'loop':''}></audio>${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`;return`<figure class="render-media"><video src="${esc(b.src)}" controls ${b.loop?'loop':''} preload="metadata"></video>${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`}
function radarPoint(i,n,fraction,radius=126){const angle=-Math.PI/2+i*Math.PI*2/n;return{x:200+Math.cos(angle)*radius*fraction,y:200+Math.sin(angle)*radius*fraction,angle}}
function radarValues(q,answer){const source=answer&&answer.__type==='radar'?answer.values||{}:{};return(q.radarAxes||[]).map(a=>{const v=Number(source[a.id]);return Number.isFinite(v)?Math.max(0,Math.min(Number(q.radarMax||5),v)):Number(q.radarMax||5)/2})}
function radarSvg(q,answer,interactive=false){const axes=q.radarAxes||radarAxesDefault(),max=Number(q.radarMax||5),values=radarValues({...q,radarAxes:axes},answer),n=axes.length;const rings=Array.from({length:5},(_,level)=>Array.from({length:n},(_,i)=>{const p=radarPoint(i,n,(level+1)/5);return`${p.x.toFixed(2)},${p.y.toFixed(2)}`}).join(' '));const area=values.map((v,i)=>{const p=radarPoint(i,n,v/max);return`${p.x.toFixed(2)},${p.y.toFixed(2)}`}).join(' ');const lines=axes.map((_,i)=>{const p=radarPoint(i,n,1);return`<line class="radar-axis" x1="200" y1="200" x2="${p.x}" y2="${p.y}"></line>`}).join('');const labels=axes.map((a,i)=>{const p=radarPoint(i,n,1.26),anchor=Math.cos(p.angle)>.25?'start':Math.cos(p.angle)<-.25?'end':'middle';return`<text class="radar-label" x="${p.x}" y="${p.y}" text-anchor="${anchor}" dominant-baseline="middle">${esc(a.label)}</text>`}).join('');const handles=axes.map((a,i)=>{const p=radarPoint(i,n,values[i]/max);return`${interactive?`<circle class="radar-handle" tabindex="0" role="slider" aria-label="${esc(a.label)}" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${values[i]}" data-radar-q="${esc(q.id)}" data-axis-id="${esc(a.id)}" data-axis-index="${i}" cx="${p.x}" cy="${p.y}" r="11"></circle>`:''}<text class="radar-value" data-radar-value="${esc(q.id)}:${esc(a.id)}" x="${p.x}" y="${p.y-15}" text-anchor="middle">${Number(values[i].toFixed(1))}</text>`}).join('');return`<div class="radar-wrap"><svg class="radar-chart" data-radar-svg="${esc(q.id)}" viewBox="0 0 400 400" aria-label="กราฟทักษะ">${rings.map(points=>`<polygon class="radar-grid" points="${points}"></polygon>`).join('')}${lines}<polygon class="radar-area" data-radar-area="${esc(q.id)}" points="${area}"></polygon>${handles}${labels}</svg></div>${interactive?'<div class="radar-note">ลากจุดบนแต่ละแกนเพื่อประเมินค่า</div>':''}`}
function questionCanvas(b){let c='';if(b.questionType==='single'||b.questionType==='multi')c=previewOptionTree(b.options||[],b.questionType);else if(b.questionType==='dropdown')c=`<div class="preview-input" style="padding:9px;color:#8793a6">เลือกคำตอบ ▾</div>`;else if(b.questionType==='rating')c=`<div class="preview-rating">${Array.from({length:Number(b.ratingMax||5)},(_,i)=>`<i>${i+1}</i>`).join('')}</div>`;else if(b.questionType==='rating_matrix'){const scale=matrixScaleOf(b);c=`<div class="matrix-wrap"><table class="rating-matrix"><thead><tr><th>รายการ</th>${scale.options.map(option=>`<th>${matrixScaleHeader(option,scale.preset)}</th>`).join('')}</tr></thead><tbody>${(b.matrixRows||[]).map(r=>`<tr><td>${esc(r.label)}</td>${scale.options.map(option=>`<td data-scale-label="${esc(MATRIX.optionHeading(option,scale.preset))}">○</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}else if(b.questionType==='radar')c=radarSvg(b,null,false);else c='<div class="preview-input"></div>';return`<div class="question-card"><div class="q-title">${esc(b.title||'คำถาม')} ${b.required?'<span class="req">*</span>':''}</div>${b.description?`<div class="q-desc">${esc(b.description)}</div>`:''}${c}</div>`}
function inspectorView(sec,b){if(state.sectionId==='START')return startPageInspector();if(!sec)return'';if(!b)return sectionInspector(sec);return blockInspector(b)}
function sectionInspector(sec){return`<div class="inspector-section"><div class="inspector-title">Section Settings</div><div class="field"><label>ชื่อ Section</label><input id="inspSecTitle" class="input" value="${esc(sec.title)}"></div><div class="field" style="margin-top:9px"><label>คำอธิบาย</label><textarea id="inspSecDesc" class="textarea">${esc(sec.description||'')}</textarea></div><div class="field" style="margin-top:9px"><label>ข้อความปุ่มถัดไป</label><input id="nextLabel" class="input" value="${esc(sec.nextLabel||'ถัดไป')}"></div></div><div class="inspector-section"><div class="head" style="margin-bottom:8px"><div class="inspector-title" style="margin:0">Page Routing</div><div class="spacer"></div><button id="addRoute" class="btn sm">+ Rule</button></div>${routingRulesView(sec)}<div class="mini-note">Rule แรกที่ตรงจะเป็นตัวเลือก Section ถัดไป ถ้าไม่ตรง Rule ใด ระบบจะไปหน้าถัดไปตามลำดับ</div></div><div class="inspector-section"><div class="inspector-title">Form Appearance</div><div class="field"><label>Accent color</label><input id="accentColor" class="input" type="color" value="${esc(state.form.theme?.accent||'#7c9cff')}"></div></div><div class="inspector-section"><button id="dupSection" class="btn" style="width:100%">Duplicate Section</button><button id="delSection" class="btn danger" style="width:100%;margin-top:8px">Delete Section</button></div>`}
function routingRulesView(sec){const qs=allQuestions();if(!sec.routingRules?.length)return'<div class="mini-note">ยังไม่มีการข้ามหน้า</div>';return sec.routingRules.map((r,i)=>`<div class="card" style="padding:9px;margin-bottom:8px"><div class="field"><label>เมื่อคำถาม</label><select class="select routeQ" data-ri="${i}"><option value="">เลือกคำถาม</option>${qs.map(q=>`<option value="${esc(q.block.id)}" ${r.questionId===q.block.id?'selected':''}>${esc(qLabel(q.block.id))}</option>`).join('')}</select></div><div class="row" style="margin-top:6px"><select class="select routeOp" data-ri="${i}" style="width:44%">${opOptions(r.operator)}</select><input class="input routeVal" data-ri="${i}" value="${esc(r.value||'')}" placeholder="ค่า เช่น 1,2"></div>${r.operator==='between'?`<input class="input routeVal2" data-ri="${i}" value="${esc(r.value2||'')}" placeholder="ถึงค่า" style="margin-top:6px">`:''}<div class="field" style="margin-top:6px"><label>ไป Section</label><select class="select routeTarget" data-ri="${i}"><option value="END" ${r.targetSectionId==='END'?'selected':''}>จบฟอร์ม</option>${state.form.sections.filter(s=>s.id!==sec.id).map(s=>`<option value="${esc(s.id)}" ${r.targetSectionId===s.id?'selected':''}>${esc(sectionLabel(s.id))}</option>`).join('')}</select></div><button class="btn sm danger delRoute" data-ri="${i}" style="margin-top:7px">ลบ Rule</button></div>`).join('')}
function opOptions(sel='equals'){return[['equals','= เท่ากับ'],['not_equals','≠ ไม่เท่ากับ'],['contains','มีตัวเลือก/ข้อความ'],['one_of','เป็นหนึ่งใน (OR)'],['not_one_of','ไม่อยู่ในกลุ่ม'],['gte','≥ มากกว่าหรือเท่ากับ'],['lte','≤ น้อยกว่าหรือเท่ากับ'],['between','อยู่ในช่วง']].map(([v,t])=>`<option value="${v}" ${sel===v?'selected':''}>${t}</option>`).join('')}
function matrixInspector(b){if(b.questionType!=='rating_matrix')return'';const scale=matrixScaleOf(b);return`<div class="inspector-section"><div class="row"><div class="inspector-title" style="margin:0">Custom Scale Matrix</div><div class="spacer"></div><button id="addMatrixRow" class="btn sm">+ แถว</button></div><div class="field" style="margin-top:8px"><label>Scale</label><select id="matrixScalePreset" class="select"><option value="standard" ${scale.preset==='standard'?'selected':''}>Standard</option><option value="custom" ${scale.preset==='custom'?'selected':''}>Custom</option><option value="ioc" ${scale.preset==='ioc'?'selected':''}>IOC Evaluation</option></select></div>${scale.preset==='standard'?`<div class="field" style="margin-top:8px"><label>คะแนนสูงสุด</label><input id="ratingMax" type="number" min="2" max="10" class="input" value="${Number(b.ratingMax||5)}"></div>`:`<div style="margin-top:8px"><div class="tiny muted">Display Label · Numeric Value</div>${scale.options.map(option=>`<div class="matrix-scale-editor-row"><input class="input matrixScaleLabel" data-scale-id="${esc(option.id)}" value="${esc(option.displayLabel)}" placeholder="Display Label"><input class="input matrixScaleValue" data-scale-id="${esc(option.id)}" type="number" step="any" value="${Number(option.value)}" ${scale.preset==='ioc'?'disabled':''}><button class="btn sm danger delMatrixScale" data-scale-id="${esc(option.id)}" ${scale.preset==='ioc'||scale.options.length<=2?'disabled':''}>×</button></div>`).join('')}${scale.preset==='custom'?'<button id="addMatrixScale" class="btn sm" style="margin-top:7px">+ Scale option</button>':''}</div>`}${scale.preset==='ioc'?`<div class="field" style="margin-top:9px"><label>IOC Threshold</label><input id="iocThreshold" type="number" step="0.01" class="input" value="${Number(scale.iocThreshold)}"></div><div class="mini-note">IOC = ΣR / N · ค่า 0 คือคำตอบจริง และไม่ถูกนับเป็นค่าว่าง</div>`:''}<div class="inspector-title" style="margin-top:14px">รายการประเมิน</div>${(b.matrixRows||[]).map(r=>`<div class="matrix-editor-row"><input class="input matrixRowLabel" data-rid="${esc(r.id)}" value="${esc(r.label)}"><button class="btn sm danger delMatrixRow" data-rid="${esc(r.id)}">×</button></div>`).join('')}<div class="mini-note">ผู้ตอบเลือกได้หนึ่งค่าต่อแถว โดยระบบเก็บ Numeric Value จาก Scale โดยตรง</div></div>`}
function questionInspector(b){const hasOpts=['single','multi','dropdown'].includes(b.questionType);const nested=['single','multi'].includes(b.questionType);return`<div class="field"><label>คำถาม</label><textarea id="qTitle" class="textarea">${esc(b.title||'')}</textarea></div><div class="field" style="margin-top:8px"><label>คำอธิบาย</label><textarea id="qDesc" class="textarea">${esc(b.description||'')}</textarea></div><div class="field" style="margin-top:8px"><label>ประเภท</label><select id="qType" class="select"><option value="short" ${b.questionType==='short'?'selected':''}>ข้อความสั้น</option><option value="long" ${b.questionType==='long'?'selected':''}>ข้อความยาว / ปลายเปิด</option><option value="single" ${b.questionType==='single'?'selected':''}>ตัวเลือกเดียว</option><option value="multi" ${b.questionType==='multi'?'selected':''}>เลือกได้หลายข้อ</option><option value="dropdown" ${b.questionType==='dropdown'?'selected':''}>Dropdown</option><option value="rating" ${b.questionType==='rating'?'selected':''}>Rating 1–N</option><option value="rating_matrix" ${b.questionType==='rating_matrix'?'selected':''}>ตาราง Rating / Custom Scale</option></select></div><label class="check" style="margin-top:9px"><input id="qRequired" type="checkbox" ${b.required?'checked':''}> จำเป็นต้องตอบ</label>${hasOpts?`<div class="inspector-section"><div class="head" style="margin-bottom:7px"><div class="inspector-title" style="margin:0">Options + hidden score</div><div class="spacer"></div><button id="addOption" class="btn sm">+ Option</button>${nested?'<button id="addOtherOption" class="btn sm">+ อื่นๆ</button>':''}</div>${optionTreeEditor(b.options||[])}</div>`:''}${['short','long'].includes(b.questionType)?validationInspector(b):''}${b.questionType==='rating'?`<div class="field" style="margin-top:9px"><label>คะแนนสูงสุด</label><input id="ratingMax" type="number" min="2" max="10" class="input" value="${Number(b.ratingMax||5)}"></div>`:''}${matrixInspector(b)}`}
function radarInspector(b){if(b.questionType!=='radar')return'';return`<div class="inspector-section"><div class="row"><div class="inspector-title" style="margin:0">Radar / Skill Graph</div><div class="spacer"></div><button id="addRadarAxis" class="btn sm" ${(b.radarAxes||[]).length>=10?'disabled':''}>+ แกน</button></div><div class="field" style="margin-top:8px"><label>ค่าสูงสุดของแต่ละแกน</label><input id="radarMax" type="number" min="2" max="10" class="input" value="${Number(b.radarMax||5)}"></div>${(b.radarAxes||[]).map((a,i)=>`<div class="radar-editor-row"><input class="input radarAxisLabel" data-aid="${esc(a.id)}" value="${esc(a.label)}" placeholder="ทักษะ ${i+1}"><button class="btn sm danger delRadarAxis" data-aid="${esc(a.id)}" ${(b.radarAxes||[]).length<=3?'disabled':''}>×</button></div>`).join('')}<div class="mini-note">กำหนดได้ 3–10 แกน ผู้ตอบจะลากจุดบนกราฟได้โดยตรง</div>${radarSvg(b,null,false)}</div>`}
function enhancedQuestionInspector(b){const radarOption=`<option value="radar" ${b.questionType==='radar'?'selected':''}>กราฟทักษะ / Radar</option>`;return questionInspector(b).replace('<option value="rating_matrix"',radarOption+'<option value="rating_matrix"')}
function validationInspector(b){const v={...defaultValidation(),...(b.validation||{})};return`<div class="inspector-section"><div class="inspector-title">Response Validation</div><label class="check"><input id="valEnabled" type="checkbox" ${v.enabled?'checked':''}> ตรวจคำตอบก่อนให้ไปต่อ</label>${v.enabled?`<div class="field" style="margin-top:8px"><label>กฎ</label><select id="valOp" class="select"><option value="forbid_equals" ${v.operator==='forbid_equals'?'selected':''}>ห้ามตอบเท่ากับ</option><option value="forbid_contains" ${v.operator==='forbid_contains'?'selected':''}>ห้ามมีข้อความ / อักขระนี้</option></select></div><div class="field" style="margin-top:7px"><label>ค่าที่ห้าม</label><input id="valValue" class="input" value="${esc(v.value||'')}" placeholder="เช่น -"></div><div class="field" style="margin-top:7px"><label>ข้อความแจ้งเตือน (ไม่บังคับ)</label><input id="valMessage" class="input" value="${esc(v.message||'')}" placeholder="เช่น กรุณาตอบเป็นข้อความ ไม่ใช้ -"></div><div class="mini-note">Conditional Display ใช้แสดง/ซ่อน Block ส่วนนี้ใช้ตรวจคำตอบจริง เช่น ห้ามผู้ตอบใช้ “-” แทนคำตอบ</div>`:''}</div>`}
function placeholderInspector(b){return['short','long'].includes(b.questionType)?`<div class="inspector-section"><div class="inspector-title">ข้อความตัวอย่างในช่องพิมพ์</div><input id="qPlaceholder" class="input" value="${esc(b.placeholder||'')}" placeholder="เช่น พิมพ์คำตอบที่นี่"><div class="mini-note">ข้อความสีเทานี้เป็นเพียงตัวอย่างและไม่ถูกนับเป็นคำตอบ</div></div>`:''}
function validateAnswer(q,answer){const v={...defaultValidation(),...(q?.validation||{})};if(!v.enabled||!['short','long'].includes(q?.questionType))return'';const text=String(answer??'').trim(),bad=String(v.value??'');if(!bad)return'';const fail=v.operator==='forbid_contains'?text.includes(bad):text===bad;return fail?(v.message||`ไม่อนุญาตให้ตอบ “${bad}”`):''}
function conditionInspector(b){const c=b.condition||defaultCondition();const qs=allQuestions().filter(x=>x.block.id!==b.id);const second=c.operator==='between';return`<div class="inspector-section"><div class="inspector-title">Conditional Display</div><label class="check"><input id="condEnabled" type="checkbox" ${c.enabled?'checked':''}> แสดง Block นี้เมื่อเงื่อนไขเป็นจริง</label>${c.enabled?`<div class="field" style="margin-top:8px"><label>อ้างอิงคำถาม</label><select id="condQ" class="select"><option value="">เลือกคำถาม</option>${qs.map(q=>`<option value="${esc(q.block.id)}" ${c.questionId===q.block.id?'selected':''}>${esc(qLabel(q.block.id))}</option>`).join('')}</select></div><div class="condition-values"><select id="condOp" class="select">${opOptions(c.operator)}</select><input id="condVal" class="input" value="${esc(c.value||'')}" placeholder="ค่า เช่น 1,2"></div>${second?`<div class="field" style="margin-top:7px"><label>ถึงค่า</label><input id="condVal2" class="input" value="${esc(c.value2||'')}" placeholder="เช่น 4"></div>`:''}<div class="mini-note">ต้องการ “1 หรือ 2” ให้เลือก <b>เป็นหนึ่งใน (OR)</b> แล้วพิมพ์ <b>1,2</b> · ต้องการ 3–4 ใช้ OR “3,4” หรือ “อยู่ในช่วง” 3 ถึง 4 · ตาราง Rating ใช้ค่าเฉลี่ยเมื่อเปรียบเทียบตัวเลข</div>`:''}</div>`}
function blockInspector(b){const ctx=currentBlockContext(),nestedHead=ctx?.parentOption?`<div class="inspector-section" style="border-color:#465775"><div class="tiny muted">CHILD BLOCK ของตัวเลือก</div><strong>${esc(ctx.parentOption.label||'ตัวเลือก')}</strong>${ctx.parentQuestion?`<button id="backParentBlock" class="btn sm" style="width:100%;margin-top:8px">← กลับ Question แม่</button>`:''}</div>`:'';let specific='';if(b.type==='heading')specific=`<div class="field"><label>ข้อความ</label><textarea id="bText" class="textarea">${esc(b.text||'')}</textarea></div><div class="field" style="margin-top:8px"><label>ขนาด</label><select id="bLevel" class="select"><option value="h1" ${b.level==='h1'?'selected':''}>ใหญ่</option><option value="h2" ${b.level==='h2'?'selected':''}>กลาง</option><option value="h3" ${b.level==='h3'?'selected':''}>เล็ก</option></select></div>`;
  else if(b.type==='text')specific=`<div class="field"><label>ข้อความ</label><textarea id="bText" class="textarea" style="min-height:150px">${esc(b.text||'')}</textarea></div>`;
  else if(b.type==='panel')specific=`<div class="field"><label>หัวข้อ</label><input id="bTitle" class="input" value="${esc(b.title||'')}"></div><div class="field" style="margin-top:8px"><label>ข้อความ</label><textarea id="bText" class="textarea">${esc(b.text||'')}</textarea></div>`;
  else if(b.type==='spacer')specific=`<div class="field"><label>ความสูง px</label><input id="bHeight" type="number" min="8" max="240" class="input" value="${Number(b.height||28)}"></div>`;

  return`${nestedHead}<div class="inspector-section"><div class="row"><div><div class="inspector-title" style="margin-bottom:2px">Selected Block</div><strong>${esc(b.type.toUpperCase())}</strong></div><div class="spacer"></div><button id="moveUp" class="btn square">↑</button><button id="moveDown" class="btn square">↓</button></div></div><div class="inspector-section">${specific}</div><div class="inspector-section"><div class="inspector-title">Layout</div><div class="field"><label>ความกว้าง</label><select id="bWidth" class="select">${[[100,'100% เต็มแถว'],[75,'75%'],[50,'50% ครึ่งแถว'],[33,'33%'],[25,'25%']].map(([v,t])=>`<option value="${v}" ${Number(b.width||100)===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="mini-note">Block ที่กว้าง 50% หรือ 33% สามารถอยู่ข้างกันได้ตามลำดับที่ลากวาง</div></div>${conditionInspector(b)}<div class="inspector-section"><button id="dupBlock" class="btn" style="width:100%">Duplicate Block</button><button id="delBlock" class="btn danger" style="width:100%;margin-top:8px">Delete Block</button></div>`}
function mediaInspector(b){return`<div class="field"><label>Media source</label><input id="mediaSrc" class="input" value="${esc(b.src||'')}" placeholder="/assets/example.png หรือ https://..."></div><div class="mini-note">เพิ่มไฟล์สื่อใน public/assets แล้วใช้เส้นทาง เช่น /assets/header.png</div><div class="field" style="margin-top:8px"><label>Caption</label><input id="mediaCaption" class="input" value="${esc(b.caption||'')}"></div>${b.type!=='image'?`<label class="check" style="margin-top:9px"><input id="mediaLoop" type="checkbox" ${b.loop?'checked':''}> Loop</label>`:''}`}
function respondentField(id){return state.form.startPage.fields.find(field=>field.id===id)}
function bindStartPageEditor(){if(state.sectionId!=='START')return;const start=state.form.startPage,title=document.querySelector('#startTitle'),description=document.querySelector('#startDescription');if(title)title.oninput=()=>{start.title=title.value;const preview=document.querySelector('.paper .paper-title');if(preview)preview.textContent=title.value;markDirty()};if(description)description.oninput=()=>{start.description=description.value;const preview=document.querySelector('.paper .paper-desc');if(preview)preview.textContent=description.value;markDirty()};const add=document.querySelector('#addRespondentField');if(add)add.onclick=()=>{start.fields.push(defaultRespondentField(start.fields.length+1));markDirty();renderAdmin()};const clear=document.querySelector('#clearPrimaryField');if(clear)clear.onclick=()=>{start.fields.forEach(field=>field.primary=false);markDirty();renderAdmin()};document.querySelectorAll('.rfLabel').forEach(el=>el.oninput=()=>{const field=respondentField(el.dataset.rfid);if(!field)return;field.label=el.value;const preview=document.querySelector(`[data-start-preview-label="${CSS.escape(field.id)}"]`);if(preview)preview.textContent=field.label+(field.required?' *':'');markDirty()});document.querySelectorAll('.rfDescription').forEach(el=>el.oninput=()=>{const field=respondentField(el.dataset.rfid);if(field){field.description=el.value;markDirty()}});document.querySelectorAll('.rfPlaceholder').forEach(el=>el.oninput=()=>{const field=respondentField(el.dataset.rfid);if(field){field.placeholder=el.value;markDirty()}});document.querySelectorAll('.rfOptions').forEach(el=>el.oninput=()=>{const field=respondentField(el.dataset.rfid);if(field){field.options=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);markDirty()}});document.querySelectorAll('.rfType').forEach(el=>el.onchange=()=>{const field=respondentField(el.dataset.rfid);if(!field)return;field.type=el.value;if(field.type==='dropdown'&&!field.options.length)field.options=['ตัวเลือก 1','ตัวเลือก 2'];markDirty();renderAdmin()});document.querySelectorAll('.rfRequired').forEach(el=>el.onchange=()=>{const field=respondentField(el.dataset.rfid);if(field){field.required=el.checked;markDirty();renderAdmin()}});document.querySelectorAll('.rfPrimary').forEach(el=>el.onchange=()=>{start.fields.forEach(field=>field.primary=field.id===el.dataset.rfid);markDirty();renderAdmin()});document.querySelectorAll('.rfValidationOp').forEach(el=>el.onchange=()=>{const field=respondentField(el.dataset.rfid);if(!field)return;field.validation={...defaultValidation(),...(field.validation||{}),enabled:!!el.value,operator:el.value||'forbid_equals'};markDirty();renderAdmin()});document.querySelectorAll('.rfValidationValue').forEach(el=>el.oninput=()=>{const field=respondentField(el.dataset.rfid);if(field){field.validation.value=el.value;markDirty()}});document.querySelectorAll('.rfValidationMessage').forEach(el=>el.oninput=()=>{const field=respondentField(el.dataset.rfid);if(field){field.validation.message=el.value;markDirty()}});document.querySelectorAll('.rfUp,.rfDown').forEach(el=>el.onclick=()=>{const index=start.fields.findIndex(field=>field.id===el.dataset.rfid),delta=el.classList.contains('rfUp')?-1:1,next=index+delta;if(index<0||next<0||next>=start.fields.length)return;[start.fields[index],start.fields[next]]=[start.fields[next],start.fields[index]];markDirty();renderAdmin()});document.querySelectorAll('.rfDelete').forEach(el=>el.onclick=()=>{start.fields=start.fields.filter(field=>field.id!==el.dataset.rfid);markDirty();renderAdmin()})}
function bindBuilder(){
  document.querySelectorAll('[data-mobile-panel]').forEach(button=>button.onclick=()=>{state.builderPanel=state.builderPanel===button.dataset.mobilePanel?null:button.dataset.mobilePanel;renderAdmin()});document.querySelectorAll('[data-close-builder-panel]').forEach(el=>el.onclick=()=>{state.builderPanel=null;renderAdmin()});const mobilePreview=document.querySelector('#mobilePreview');if(mobilePreview)mobilePreview.onclick=previewForm;const mobileSave=document.querySelector('#mobileSave');if(mobileSave)mobileSave.onclick=()=>saveForm(false);const mobilePublish=document.querySelector('#mobilePublish');if(mobilePublish)mobilePublish.onclick=publishForm;
  const formTitle=document.querySelector('#formTitle');const formDesc=document.querySelector('#formDesc');if(formTitle)formTitle.oninput=e=>{state.form.title=e.target.value;markDirty()};if(formDesc)formDesc.oninput=e=>{state.form.description=e.target.value;markDirty()};
  const st=document.querySelector('#sectionTitle'),sd=document.querySelector('#sectionDesc');if(st)st.oninput=e=>{currentSection().title=e.target.value;const x=document.querySelector('#inspSecTitle');if(x)x.value=e.target.value;markDirty();refreshSectionRailLabels()};if(sd)sd.oninput=e=>{currentSection().description=e.target.value;const x=document.querySelector('#inspSecDesc');if(x)x.value=e.target.value;markDirty()};
  document.querySelector('#addSection').onclick=()=>{syncInspector();const s=newSection(state.form.sections.length+1);state.form.sections.push(s);state.sectionId=s.id;state.blockId=null;markDirty();renderAdmin()};
  const startNav=document.querySelector('[data-start-page]');if(startNav)startNav.onclick=()=>{syncInspector();state.sectionId='START';state.blockId=null;if(matchMedia('(max-width:1099px)').matches)state.builderPanel=null;renderAdmin()};
  document.querySelectorAll('[data-section]').forEach(el=>el.onclick=e=>{if(e.target.closest('button'))return;syncInspector();state.sectionId=el.dataset.section;state.blockId=null;if(matchMedia('(max-width:1099px)').matches)state.builderPanel=null;renderAdmin()});
  document.querySelectorAll('[data-sec-up]').forEach(b=>b.onclick=e=>{e.stopPropagation();moveSection(b.dataset.secUp,-1)});document.querySelectorAll('[data-sec-down]').forEach(b=>b.onclick=e=>{e.stopPropagation();moveSection(b.dataset.secDown,1)});document.querySelectorAll('[data-sec-dup]').forEach(b=>b.onclick=e=>{e.stopPropagation();duplicateSection(b.dataset.secDup)});
  document.querySelectorAll('[data-add-block]').forEach(b=>b.onclick=()=>{syncInspector();const nb=newBlock(b.dataset.addBlock);currentSection().blocks.push(nb);state.blockId=nb.id;if(matchMedia('(max-width:1099px)').matches)state.builderPanel='edit';markDirty();renderAdmin()});
  document.querySelectorAll('[data-block]').forEach(el=>{el.onclick=e=>{e.stopPropagation();syncInspector();state.blockId=el.dataset.block;if(matchMedia('(max-width:1099px)').matches)state.builderPanel='edit';renderAdmin()};if(el.dataset.nested==='1'||matchMedia('(pointer:coarse)').matches){el.draggable=false;return}el.ondragstart=e=>{state.dragBlockId=el.dataset.block;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'};el.ondragend=()=>{state.dragBlockId=null;document.querySelectorAll('.block-shell').forEach(x=>x.classList.remove('dragging','drop-before','drop-after'))};el.ondragover=e=>{e.preventDefault();if(!state.dragBlockId||state.dragBlockId===el.dataset.block)return;const r=el.getBoundingClientRect();el.classList.toggle('drop-before',e.clientX<r.left+r.width/2);el.classList.toggle('drop-after',e.clientX>=r.left+r.width/2)};el.ondragleave=()=>el.classList.remove('drop-before','drop-after');el.ondrop=e=>{e.preventDefault();reorderBlocks(state.dragBlockId,el.dataset.block,e.clientX<el.getBoundingClientRect().left+el.getBoundingClientRect().width/2)}});
  bindStartPageEditor();bindInspector();
}

function applyRemoteForm(raw,updatedAt,remoteDraft=false){if(!state.form||state.collab.role==='editor')return;const id=state.form.id,pub=state.form.published,publication=state.form.publication,oldSec=state.sectionId;const f=migrateForm(structuredClone(raw));state.form={id,...f,published:pub,publication,updated_at:updatedAt||state.form.updated_at};state.sectionId=oldSec==='START'?'START':f.sections.some(s=>s.id===oldSec)?oldSec:f.sections[0]?.id||null;state.blockId=null;state.dirty=false;state.collab.remoteDraft=remoteDraft;renderAdmin()}
function handleCollabMessage(raw){let m;try{m=JSON.parse(raw)}catch{return}if(m.type==='welcome'){state.collab.role=m.role||'viewer';state.collab.editor=m.editor||null;state.collab.peers=m.peers||[];state.collab.connected=true;state.collab.connecting=false;const recover=!!(m.latestDraft?.form&&m.latestDraft.updated_at===state.form?.updated_at);if(recover&&state.collab.role==='viewer')applyRemoteForm(m.latestDraft.form,m.latestDraft.updated_at,!m.latestDraft.committed);else{if(recover&&state.collab.role==='editor'&&!m.latestDraft.committed){const id=state.form.id,pub=state.form.published,publication=state.form.publication,oldSec=state.sectionId,f=migrateForm(structuredClone(m.latestDraft.form));state.form={id,...f,published:pub,publication,updated_at:m.latestDraft.updated_at};state.sectionId=oldSec==='START'?'START':f.sections.some(s=>s.id===oldSec)?oldSec:f.sections[0]?.id||null;state.dirty=true;state.editRevision++;toast('กู้ Draft ล่าสุดที่ยังไม่ทันบันทึกกลับมาแล้ว',4200)}renderAdmin()}if(state.collab.role==='editor')toast('คุณได้สิทธิ์แก้ไขฟอร์มนี้');else toast(`${state.collab.editor?.name||'สมาชิกคนอื่น'} กำลังแก้ไขอยู่ · เปิดโหมดดูสด`,3200);return}if(m.type==='presence'){const oldEditor=state.collab.editor?.sessionId||'';state.collab.peers=m.peers||[];state.collab.editor=m.editor||null;if(state.collab.role==='viewer'&&oldEditor!==(state.collab.editor?.sessionId||''))renderAdmin();else updateCollabUI();return}if(m.type==='draft'&&state.collab.role==='viewer'){applyRemoteForm(m.form,m.updated_at,true);return}if(m.type==='committed'&&state.collab.role==='viewer'){applyRemoteForm(m.form,m.updated_at,false);return}if(m.type==='lock_granted'){state.collab.role='editor';state.collab.editor={sessionId:state.sessionId,name:state.memberName};renderAdmin();toast('ได้สิทธิ์แก้ไขแล้ว');return}if(m.type==='lock_denied'){state.collab.editor=m.editor||state.collab.editor;toast(`${state.collab.editor?.name||'สมาชิกคนอื่น'} ยังแก้ไขอยู่ กรุณารอ`,3200);renderAdmin();return}if(m.type==='lock_available'){state.collab.editor=null;renderAdmin();toast('สิทธิ์แก้ไขว่างแล้ว กด “ขอแก้ไข” เพื่อทำงานต่อ',3600);return}if(m.type==='commit_ack'){const p=state.collab.pending.get(m.reqId);if(p){state.collab.pending.delete(m.reqId);p.resolve(m)}return}if(m.type==='error'){const p=m.reqId&&state.collab.pending.get(m.reqId);if(p){state.collab.pending.delete(m.reqId);p.reject(new Error(m.error||'Live Collaboration error'));return}toast(m.error||'Live Collaboration error',3500)}}
function requestEditLock(){if(state.collab.ws?.readyState===1)state.collab.ws.send(JSON.stringify({type:'request_lock'}))}
function collabCommit(){return new Promise((resolve,reject)=>{if(state.collab.ws?.readyState!==1||state.collab.role!=='editor'){reject(new Error('Live Collaboration ไม่พร้อมบันทึก'));return}const reqId=uid('commit');const timer=setTimeout(()=>{state.collab.pending.delete(reqId);reject(new Error('หมดเวลารอการบันทึก'))},8000);state.collab.pending.set(reqId,{resolve:m=>{clearTimeout(timer);resolve(m)},reject:e=>{clearTimeout(timer);reject(e)}});state.collab.ws.send(JSON.stringify({type:'commit',reqId,baseUpdatedAt:state.form.updated_at,form:cleanFormSnapshot()}))})}
async function saveForm(silent=false){if(!state.form||state.saving)return;if(!state.dirty){if(!silent)toast('บันทึกแล้ว');return}if(state.collab.connected&&state.collab.role==='viewer'){toast(`${state.collab.editor?.name||'สมาชิกคนอื่น'} กำลังแก้ไขอยู่ คุณยังบันทึกไม่ได้`,3200);return}syncInspector();const savingRevision=state.editRevision;state.saving=true;updateSaveBadge();try{let d;if(state.collab.connected&&state.collab.role==='editor')d=await collabCommit();else{const payload=cleanFormSnapshot();payload.baseUpdatedAt=state.form.updated_at;d=await api('/api/forms/'+encodeURIComponent(state.form.id),{method:'PUT',body:JSON.stringify(payload)})}state.form.updated_at=d.updated_at;state.collab.remoteDraft=false;if(state.editRevision===savingRevision)state.dirty=false;else{state.dirty=true;clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{if(state.dirty&&state.form&&!state.saving)saveForm(true)},5000)}await loadForms();if(!silent)toast(state.dirty?'บันทึกรอบแรกแล้ว · กำลังรอบันทึกการแก้ล่าสุด':'บันทึกแล้ว')}catch(e){if(e.status===409||e.status===423){toast(e.message||'มีสมาชิกคนอื่นกำลังแก้ไขฟอร์มนี้',5200)}else toast('บันทึกไม่สำเร็จ: '+e.message,4200)}finally{state.saving=false;updateSaveBadge()}}
function duplicateOptionLabelQuestion(){return allQuestions().map(x=>x.block).filter(q=>q.questionType==='dropdown').find(q=>{const seen=new Set();return flattenOptions(q.options||[]).some(o=>{const label=String(o.label||'').trim().toLocaleLowerCase();if(!label)return false;if(seen.has(label))return true;seen.add(label);return false})})}
function validatePublishable(){if(!state.form.sections.length){toast('ต้องมีอย่างน้อย 1 Section');return false}if(!allQuestions().length){toast('ต้องมีอย่างน้อย 1 Question');return false}const duplicate=duplicateOptionLabelQuestion();if(duplicate){toast(`คำถาม “${duplicate.title||'คำถาม'}” มีชื่อตัวเลือกซ้ำ กรุณาแก้ก่อน Publish`,4800);return false}for(const{block:q}of allQuestions()){if(q.questionType!=='rating_matrix')continue;const source=q.matrixScale&&typeof q.matrixScale==='object'?q.matrixScale:{},preset=['custom','ioc'].includes(String(source.preset).toLowerCase())?String(source.preset).toLowerCase():'standard',options=preset==='standard'?MATRIX.standardOptions(q.ratingMax):(Array.isArray(source.options)?source.options:[]),values=options.map(option=>option?.value==null||option.value===''?NaN:Number(option.value));if(options.length<2||values.some(value=>!Number.isFinite(value))||new Set(values).size!==values.length){toast(`Scale ของ “${q.title||'คำถาม'}” ต้องมี Numeric Value ไม่ซ้ำกันอย่างน้อย 2 ค่า`,4800);return false}if(preset==='ioc'&&(values.length!==3||![-1,0,1].every(value=>values.includes(value)))){toast(`IOC Scale ของ “${q.title||'คำถาม'}” ต้องเป็น -1, 0, +1`,4800);return false}if(preset==='ioc'&&!Number.isFinite(Number(source.iocThreshold))){toast(`IOC Threshold ของ “${q.title||'คำถาม'}” ไม่ถูกต้อง`,4800);return false}}return true}

function hasAnswer(q,a){if(q.questionType==='rating_matrix')return!!(a&&a.__type==='matrix'&&Object.keys(a.rows||{}).length);if(q.questionType==='radar'){const axes=q.radarAxes||[];return!!(axes.length>=3&&a&&a.__type==='radar'&&axes.every(axis=>a.values?.[axis.id]!=null&&Number.isFinite(Number(a.values[axis.id]))))}if(q.questionType==='short'||q.questionType==='long'||q.questionType==='dropdown')return String(a??'').trim()!=='';return answerValues(a).length>0}

function summaryBars(items,total){if(!items.length)return'<div class="muted small">ยังไม่มีคำตอบสำหรับคำถามนี้</div>';const max=Math.max(1,...items.map(x=>x.count));return`<div class="summary-bars">${items.map(x=>`<div class="summary-row"><span>${esc(x.label)}</span><div class="summary-bar"><i style="width:${Math.max(2,Math.round(x.count/max*100))}%"></i></div><strong>${x.count} · ${pct(x.count,total)}%</strong></div>`).join('')}</div>`}
function responseQuestionSummary(q,pool){const vals=pool.map(r=>r.answers?.[q.id]).filter(a=>hasAnswer(q,a));const answered=vals.length;const head=`<div class="summary-head"><div class="grow"><strong>${esc(q.title||'คำถาม')}</strong><div class="tiny muted">${esc(({short:'ข้อความสั้น',long:'ข้อความยาว',single:'ตัวเลือกเดียว',multi:'เลือกได้หลายข้อ',dropdown:'Dropdown',rating:'Rating',rating_matrix:'ตาราง Rating',radar:'กราฟทักษะ / Radar'})[q.questionType]||q.questionType)} · ตอบ ${answered}/${pool.length}</div></div></div>`;
 if(q.questionType==='short'||q.questionType==='long'){const counts=new Map();for(const a of vals){const t=String(a||'').trim();if(t)counts.set(t,(counts.get(t)||0)+1)}const top=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,12);return`<div class="summary-q">${head}<div class="tiny muted" style="margin-bottom:8px">ข้อความปลายเปิดไม่มีคะแนน ระบบจึงสรุปเป็นจำนวนคำตอบซ้ำแบบตรงตัวและตัวอย่างคำตอบ</div>${top.length?`<div class="summary-texts">${top.map(([t,n])=>`<div class="summary-text"><strong>${n}×</strong> ${esc(t)}</div>`).join('')}</div>`:'<div class="muted small">ยังไม่มีข้อความ</div>'}</div>`}

  const questionIdsInSections=ids=>{const set=new Set(ids),out=[];form.sections.filter(s=>set.has(s.id)).forEach(s=>walkBlockTree(s.blocks||[],b=>{if(b.type==='question')out.push(b.id)}));return out};
  const discardSectionAnswers=(ids)=>{for(const qid of questionIdsInSections(ids))delete sess.answers[qid]};
  const pruneHiddenAnswers=()=>{
    for(let pass=0;pass<Math.max(1,allQuestions(form).length+1);pass++){
      const active=new Set();for(const s of form.sections)for(const b of collectRuntimeBlocks(s.blocks||[],sess.answers,[]))if(b.type==='question')active.add(b.id);

  const resolvedPath=()=>{const path=[],visits={};let next=first();while(next!=='END'&&path.length<100){const sec=secById(next);if(!sec)break;visits[next]=(visits[next]||0)+1;if(visits[next]>15)break;path.push(next);next=chooseNext(sec)}return path};
  const pruneAnswersOutsidePath=path=>{const sectionIds=new Set(path),active=new Set();for(const sec of form.sections){if(!sectionIds.has(sec.id))continue;for(const b of collectRuntimeBlocks(sec.blocks||[],sess.answers,[]))if(b.type==='question')active.add(b.id)}for(const id of Object.keys(sess.answers))if(!active.has(id))delete sess.answers[id]};
  const showFatal=(title,message,backToIntro=false)=>{

    const recover=document.querySelector('#runtimeRecover');if(recover)recover.onclick=()=>{sess.sectionId='INTRO';sess.history=[];sess.future=[];sess.visits={};sess.lastRenderSection='';render()};

  const render=(keepScroll=false)=>{

      const startPage=form.startPage||defaultStartPage(form.title,form.description);app.innerHTML=`<div class="respond-bg"><div class="respond-shell"><div class="respond-brand brand">AP+<span>forms</span>${isPreview?' · PREVIEW':''}</div><div class="respond-paper"><h1 class="respond-title">${esc(startPage.title||form.title)}</h1>${startPage.description?`<p class="respond-desc">${esc(startPage.description)}</p>`:''}<div style="display:grid;gap:12px;margin-top:20px">${startPage.fields.map(runtimeRespondentField).join('')||'<div class="tiny" style="color:#68748a">แบบฟอร์มนี้ไม่เก็บข้อมูลระบุตัวผู้ตอบ</div>'}</div><div class="runtime-actions"><button id="startRuntime" class="runtime-btn">เริ่มตอบ</button>${isPreview?'<button id="exitPreview" class="runtime-btn light">กลับ Builder</button>':''}</div></div></div></div>`;
      const startBtn=document.querySelector('#startRuntime');
      const start=()=>{const meta={};for(const field of startPage.fields){const input=document.querySelector(`[data-respondent-field="${CSS.escape(field.id)}"]`),value=input?.value?.trim()||'',message=validateRespondentField(field,value),error=document.querySelector(`[data-respondent-error="${CSS.escape(field.id)}"]`);input?.classList.toggle('invalid',!!message);if(error){error.textContent=message;error.classList.toggle('show',!!message)}if(message){input?.focus();toast(message,3000);return}if(value)meta[field.id]=value}sess.respondentMeta=meta;const primary=startPage.fields.find(field=>field.primary);sess.name=(primary&&meta[primary.id])||Object.values(meta)[0]||(isPreview?'Preview':'Anonymous');sess.sectionId=first();sess.history=[];sess.future=[];sess.visits={};sess.lastRenderSection='';render()};

    app.innerHTML=`<div class="respond-bg"><div class="respond-shell"><div class="respond-brand brand">AP+<span>forms</span>${isPreview?' · PREVIEW':''}</div><div class="respond-paper"><div class="tiny" style="color:#7d899d">SECTION ${idx+1} / ${form.sections.length}</div><h1 class="respond-title" style="font-size:25px;margin-top:4px">${esc(sec.title)}</h1>${sec.description?`<p class="respond-desc">${esc(sec.description)}</p>`:''}<div class="progress"><i style="width:${Math.max(6,Math.round((idx+1)/Math.max(1,form.sections.length)*100))}%"></i></div><div class="runtime-grid">${blocks.map(b=>runtimeBlock(b,sess.answers)).join('')||'<div class="drop-hint">หน้านี้ไม่มี Block ที่แสดงตามเงื่อนไข</div>'}</div><div class="runtime-actions">${sess.history.length?'<button id="runtimeBack" class="runtime-btn light">ย้อนกลับ</button>':''}${isPreview?'<button id="exitPreviewInline" class="runtime-btn light">ออกจาก Preview</button>':''}<div class="spacer"></div><button id="runtimeNext" class="runtime-btn">${idx===form.sections.length-1?'ส่งคำตอบ':esc(sec.nextLabel||'ถัดไป')}</button></div></div></div></div>`;

        if(q.required&&(!hasAnswer(q,a)||(q.questionType==='rating_matrix'&&(q.matrixRows||[]).some(r=>!a?.rows||!Object.prototype.hasOwnProperty.call(a.rows,r.id)||a.rows[r.id]==null||a.rows[r.id]==='')))){

  };
  function runtimeOptionTree(q,list,answer,parentId='root',depth=0){const selected=answerValues(answer),selectedIds=answerSelectedIds(answer),texts=answerTextMap(answer),useIds=selectedIds.length>0;return(list||[]).map(o=>{const on=useIds?selectedIds.includes(o.id):selected.includes(o.label);const typ=q.questionType==='single'?'radio':'checkbox';const name=q.questionType==='single'?`q_${q.id}_${parentId}`:'';const childBlocks=on&&o.blocks?.length?`<div class="option-child-blocks">${(o.blocks||[]).filter(b=>visibleBlock(b,sess.answers)).map(b=>runtimeBlock(b,sess.answers,true)).join('')}</div>`:'';const child=on&&o.children?.length?`<div class="nested-options">${runtimeOptionTree(q,o.children,answer,o.id,depth+1)}</div>`:'';const extra=on&&o.allowText?`<input class="runtime-input other-input" data-other-q="${esc(q.id)}" data-other-id="${esc(o.id)}" value="${esc(texts[o.id]||'')}" placeholder="${esc(o.placeholder||'โปรดระบุรายละเอียด')}">`:'';return`<div><label class="choice"><input type="${typ}" ${name?`name="${esc(name)}"`:''} data-choice-q="${esc(q.id)}" data-opt-id="${esc(o.id)}" value="${esc(o.label)}" ${on?'checked':''}><span>${esc(o.label)}</span></label>${extra}${childBlocks}${child}</div>`}).join('')}
  function matrixRuntime(q,answer){const rows=answer&&answer.__type==='matrix'?answer.rows||{}:{},scale=matrixScaleOf(q);return`<div class="matrix-wrap"><table class="rating-matrix"><thead><tr><th>รายการ</th>${scale.options.map(option=>`<th>${matrixScaleHeader(option,scale.preset)}</th>`).join('')}</tr></thead><tbody>${(q.matrixRows||[]).map(r=>`<tr><td>${esc(r.label)}</td>${scale.options.map(option=>{const heading=MATRIX.optionHeading(option,scale.preset);return`<td data-scale-label="${esc(heading)}"><input type="radio" aria-label="${esc(`${r.label}: ${heading}`)}" name="mx_${esc(q.id)}_${esc(r.id)}" data-matrix-q="${esc(q.id)}" data-row-id="${esc(r.id)}" value="${option.value}" ${Object.prototype.hasOwnProperty.call(rows,r.id)&&Number(rows[r.id])===option.value?'checked':''}></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
  function runtimeBlock(b,answers,nested=false){const w=`width:${nested?'100%':widthCss(b.width)}`;if(b.type==='heading')return`<div style="${w}" class="render-heading ${esc(b.level||'h2')}">${esc(b.text||'')}</div>`;if(b.type==='text')return`<div style="${w}" class="render-text">${esc(b.text||'')}</div>`;if(b.type==='panel')return`<div style="${w}" class="render-panel"><strong>${esc(b.title||'')}</strong><div>${esc(b.text||'')}</div></div>`;if(b.type==='divider')return`<div style="${w}" class="render-divider"></div>`;if(b.type==='spacer')return`<div style="${w};height:${Number(b.height||28)}px"></div>`;if(['image','audio','video'].includes(b.type))return`<div style="${w}">${mediaCanvas(b)}</div>`;if(b.type!=='question')return'';const a=answers[b.id];let control='';if(b.questionType==='short')control=`<input class="runtime-input" data-input="${esc(b.id)}" value="${esc(typeof a==='string'?a:'')}" placeholder="${esc(b.placeholder||'')}">`;else if(b.questionType==='long')control=`<textarea class="runtime-textarea" data-input="${esc(b.id)}" placeholder="${esc(b.placeholder||'')}">${esc(typeof a==='string'?a:'')}</textarea>`;else if(b.questionType==='single'||b.questionType==='multi')control=runtimeOptionTree(b,b.options||[],a);else if(b.questionType==='dropdown'){const val=answerValues(a)[0]||'';control=`<select class="runtime-select" data-select="${esc(b.id)}"><option value="">เลือกคำตอบ</option>${flattenOptions(b.options||[]).map(o=>`<option value="${esc(o.label)}" ${val===o.label?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`}else if(b.questionType==='rating')control=`<div class="runtime-rate">${Array.from({length:Number(b.ratingMax||5)},(_,i)=>`<button type="button" data-rate-q="${esc(b.id)}" data-rate="${i+1}" class="${Number(a)===i+1?'on':''}">${i+1}</button>`).join('')}</div>`;else if(b.questionType==='rating_matrix')control=matrixRuntime(b,a);else if(b.questionType==='radar')control=radarSvg(b,a,true);return`<div class="runtime-q" data-rq="${esc(b
